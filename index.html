  if (!active || !payload?.length) return null;
  const s = sessions[label-1];
  if (!s) return null;
  return (
    <div style={{background:"#1a1f2e",border:"1px solid #21262d",borderRadius:8,padding:"8px 12px",fontSize:11}}>
      <div style={{color:"#7d8590",marginBottom:4}}>#{s.n} · {s.f} {s.d}</div>
      <div style={{color:"#e6edf3",fontWeight:700}}>{payload[0].value} {payload[0].name}</div>
      <div style={{color:COLORS[s.t]||"#888",marginTop:2}}>{TYPE_LABELS[s.t]}</div>

  );
};

function TrainingLog() {
  const [filter, setFilter] = useState("all");

  const stats = useMemo(() => {
    const total = SESSIONS.reduce((a,s) => a+s.cal, 0);
    const maxCal = Math.max(...SESSIONS.map(s=>s.cal));
    const maxFCM = Math.max(...SESSIONS.map(s=>s.fcM));
    const maxZ5  = Math.max(...SESSIONS.filter(s=>s.z5!=null).map(s=>s.z5));
    const mins = s => { const [h,m] = s.dur.split(":").map(Number); return h*60+m; };
    const longest = SESSIONS.filter(s=>s.t!=="caminata").reduce((a,s) => mins(s)>mins(a)?s:a);
    const maxFCP = Math.max(...SESSIONS.map(s=>s.fcP));
    const byDay = {};
    SESSIONS.forEach(s => { byDay[s.f] = byDay[s.f] || {cal:0,n:0}; byDay[s.f].cal += s.cal; byDay[s.f].n++; });
    const [bestDay, bestDayV] = Object.entries(byDay).reduce((a,e) => e[1].cal>a[1].cal?e:a);
    return {total, maxCal, maxFCM, maxZ5, maxFCP,
      longest, longestMin: mins(longest), bestDay, bestDayCal: bestDayV.cal, bestDayDouble: bestDayV.n>1,
      recFCPDates: SESSIONS.filter(s=>s.fcP===maxFCP).map(s=>s.f).join(" & "),
      recCalDate: SESSIONS.find(s=>s.cal===maxCal)?.f,
      recFCMDate: SESSIONS.find(s=>s.fcM===maxFCM)?.f,
      recZ5Date:  SESSIONS.find(s=>s.z5===maxZ5)?.f,
    };
  }, []);

  const filtered = filter === "all" ? SESSIONS : SESSIONS.filter(s => s.t === filter);
  const lastSession = SESSIONS[SESSIONS.length-1];

  const barColor = (s) => s.cal === stats.maxCal ? "#f97316" : COLORS[s.t]||"#1a6cf5";

  return (
    <div style={{background:"#080a0f",minHeight:"100vh",color:"#e6edf3",fontFamily:"system-ui,-apple-system,sans-serif"}}>

      {/* HEADER */}
      <div style={{padding:"36px 36px 24px",borderBottom:"1px solid #21262d",background:"linear-gradient(135deg,#080a0f,#0d1520)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:20}}>
          <div>
            <div style={{fontSize:"clamp(40px,7vw,72px)",fontWeight:900,lineHeight:.9,letterSpacing:-2}}>
              TRAINING<br/><span style={{color:"#f97316"}}>LOG</span>
            </div>
            <div style={{fontSize:10,color:"#7d8590",letterSpacing:3,textTransform:"uppercase",marginTop:8}}>
              Nicolás · Buenos Aires · Creatina desde 13/03/2026
            </div>
          </div>
          <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
            {[
              {v:SESSIONS.length,l:"Sesiones"},
              {v:stats.total.toLocaleString("es-AR"),l:"Cal activas"},
              {v:lastSession.cr.replace("D","D"),l:"Creatina"},
            ].map(m=>(
              <div key={m.l} style={{textAlign:"right"}}>
                <div style={{fontSize:"clamp(28px,4vw,40px)",fontWeight:900,color:"#f97316",lineHeight:1,letterSpacing:-1}}>{m.v}</div>
                <div style={{fontSize:9,color:"#7d8590",letterSpacing:2,textTransform:"uppercase",marginTop:3}}>{m.l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* LEGEND */}
      <div style={{display:"flex",gap:14,flexWrap:"wrap",padding:"10px 36px",borderBottom:"1px solid #21262d",background:"#0d1117"}}>
        {Object.entries(COLORS).map(([k,c])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:6,fontSize:9,color:"#7d8590",letterSpacing:1,textTransform:"uppercase"}}>
            <div style={{width:8,height:8,borderRadius:2,background:c,border:k==="estimado"?"1px dashed #60a5fa":"none",opacity:k==="estimado"?.6:1}}/>
            {TYPE_LABELS[k]}
          </div>
        ))}
      </div>

      <div style={{padding:"24px 36px"}}>

        {/* STATS */}
        <div style={{fontSize:20,fontWeight:900,letterSpacing:-.5,marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
          Resumen <div style={{flex:1,height:1,background:"#21262d"}}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10,marginBottom:28}}>
          <StatCard val={SESSIONS.filter(s=>s.t==="funcional").length} lbl="Funcionales" accent="#1a6cf5"/>
          <StatCard val={SESSIONS.filter(s=>s.t==="intervalos").length} lbl="Intervalos" accent="#8b5cf6"/>
          <StatCard val={SESSIONS.filter(s=>s.t==="maquinas").length} lbl="Máquinas TS" accent="#10b981"/>
          <StatCard val={stats.maxCal} lbl="Récord cal" sub={stats.recCalDate} accent="#f97316"/>
          <StatCard val={stats.maxFCM+" LPM"} lbl="FC Máx" sub={stats.recFCMDate} accent="#ef4444"/>
          <StatCard val={stats.maxZ5+" min"} lbl="Récord Z5" sub={stats.recZ5Date} accent="#8b5cf6"/>
        </div>

        {/* RECORDS */}
        <div style={{fontSize:20,fontWeight:900,letterSpacing:-.5,marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
          Récords <div style={{flex:1,height:1,background:"#21262d"}}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:10,marginBottom:28}}>
          <RecordCard icon="🔥" val={stats.maxCal+" kcal"} lbl="Cal activas sesión" date={stats.recCalDate}/>
          <RecordCard icon="💜" val={stats.maxZ5+" min"} lbl="Zona 5 en sesión" date={stats.recZ5Date}/>
          <RecordCard icon="❤️" val={stats.maxFCM+" LPM"} lbl="FC Máxima" date={stats.recFCMDate}/>
          <RecordCard icon="⚡" val={stats.bestDayCal+" kcal"} lbl="Cal activas en día" date={stats.bestDay+(stats.bestDayDouble?" (doble)":"")}/>
          <RecordCard icon="⏱" val={stats.longestMin+" min"} lbl="Sesión más larga" date={stats.longest.f}/>
          <RecordCard icon="🏋️" val={stats.maxFCP+" LPM"} lbl="FC Prom máxima" date={stats.recFCPDates}/>
        </div>

        {/* CHARTS */}
        <div style={{fontSize:20,fontWeight:900,letterSpacing:-.5,marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
          Evolución <div style={{flex:1,height:1,background:"#21262d"}}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:28}}>

          {/* CAL CHART - full width */}
          <div style={{background:"#0d1117",border:"1px solid #21262d",borderRadius:8,padding:20,gridColumn:"1/-1"}}>
            <div style={{fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#7d8590",marginBottom:14}}>Calorías activas por sesión</div>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={SESSIONS} margin={{top:4,right:4,left:-20,bottom:0}}>
                <XAxis dataKey="n" tick={{fill:"#7d8590",fontSize:9}} tickLine={false} axisLine={false}/>
                <YAxis tick={{fill:"#7d8590",fontSize:9}} tickLine={false} axisLine={false}/>
                <Tooltip content={<CustomTooltip sessions={SESSIONS}/>}/>
                <Bar dataKey="cal" radius={[2,2,0,0]} name="kcal">
                  {SESSIONS.map((s,i)=><Cell key={i} fill={barColor(s)} opacity={s.cal===stats.maxCal?1:.8}/>)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          {/* FC CHART */}
          <div style={{background:"#0d1117",border:"1px solid #21262d",borderRadius:8,padding:20}}>
            <div style={{fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#7d8590",marginBottom:14}}>FC Promedio por sesión</div>
            <ResponsiveContainer width="100%" height={150}>
              <LineChart data={SESSIONS} margin={{top:4,right:4,left:-20,bottom:0}}>
                <XAxis dataKey="n" tick={{fill:"#7d8590",fontSize:9}} tickLine={false} axisLine={false}/>
                <YAxis tick={{fill:"#7d8590",fontSize:9}} tickLine={false} axisLine={false} domain={[120,170]}/>
                <Tooltip content={<CustomTooltip sessions={SESSIONS}/>}/>
                <Line type="monotone" dataKey="fcP" stroke="#f97316" strokeWidth={2} dot={{fill:"#f97316",r:2}} activeDot={{r:4}} name="LPM"/>
              </LineChart>
            </ResponsiveContainer>
          </div>

          {/* Z5 CHART */}
          <div style={{background:"#0d1117",border:"1px solid #21262d",borderRadius:8,padding:20}}>
            <div style={{fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#7d8590",marginBottom:14}}>Zona 5 (min) por sesión</div>
            <ResponsiveContainer width="100%" height={150}>
              <BarChart data={SESSIONS} margin={{top:4,right:4,left:-20,bottom:0}}>
                <XAxis dataKey="n" tick={{fill:"#7d8590",fontSize:9}} tickLine={false} axisLine={false}/>
                <YAxis tick={{fill:"#7d8590",fontSize:9}} tickLine={false} axisLine={false}/>
                <Tooltip content={<CustomTooltip sessions={SESSIONS}/>}/>
                <Bar dataKey="z5" radius={[2,2,0,0]} name="min">
                  {SESSIONS.map((s,i)=><Cell key={i} fill={s.z5===stats.maxZ5?"#f97316":"rgba(139,92,246,.7)"}/>)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

        </div>

        {/* FILTER */}
        <div style={{fontSize:20,fontWeight:900,letterSpacing:-.5,marginBottom:12,display:"flex",alignItems:"center",gap:10}}>
          Historial <div style={{flex:1,height:1,background:"#21262d"}}/>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          {["all","funcional","intervalos","maquinas","yoga","caminata"].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} style={{
              padding:"4px 12px",borderRadius:6,border:"1px solid",fontSize:10,letterSpacing:1,
              textTransform:"uppercase",cursor:"pointer",fontWeight:600,transition:"all .15s",
              background:filter===f?(COLORS[f]||"#f97316"):"transparent",
              borderColor:filter===f?(COLORS[f]||"#f97316"):"#21262d",
              color:filter===f?"#fff":"#7d8590",
            }}>
              {f==="all"?"Todos":TYPE_LABELS[f]}
            </button>
          ))}
        </div>

        {/* TABLE */}
        <div style={{overflowX:"auto",border:"1px solid #21262d",borderRadius:8}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#161b22",borderBottom:"1px solid #21262d"}}>
                {["#","Fecha","Tipo","Dur.","Cal activas","FC prom","FC máx","Zona 5","Esfuerzo","Creatina"].map(h=>(
                  <th key={h} style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"#7d8590",padding:"10px 12px",textAlign:"left",whiteSpace:"nowrap",fontWeight:500}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((s,i)=>{
                const isRec = s.cal===stats.maxCal;
                const isFCRec = s.fcM===stats.maxFCM;
                const isZ5Rec = s.z5===stats.maxZ5;
                const calCol = s.cal>=600?"#f97316":s.cal>=450?"#fbbf24":"#e6edf3";
                return (
                  <tr key={s.n} style={{borderBottom:i<filtered.length-1?"1px solid #21262d":"none",background:isRec?"rgba(249,115,22,.04)":"transparent"}}>
                    <td style={{padding:"9px 12px",color:"#7d8590",fontFamily:"monospace",fontSize:11}}>{s.n}</td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <span style={{fontFamily:"monospace",fontSize:11}}>{s.f}</span>
                      <span style={{display:"block",fontSize:9,color:"#7d8590"}}>{s.d}</span>
                    </td>
                    <td style={{padding:"9px 12px"}}><Badge tipo={s.t}/></td>
                    <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:11,color:"#7d8590"}}>{s.dur}</td>
                    <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:13,fontWeight:700,color:calCol,whiteSpace:"nowrap"}}>
                      {s.cal.toLocaleString("es-AR")}{isRec?" 🔥":""}
                    </td>
                    <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:11}}>{s.fcP} LPM</td>
                    <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:11,color:isFCRec?"#f97316":"inherit",whiteSpace:"nowrap"}}>
                      {s.fcM} LPM{isFCRec?" ⭐":""}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {s.z5!=null ? (
                        <div style={{display:"flex",alignItems:"center",gap:5}}>
                          <div style={{width:Math.round((s.z5/stats.maxZ5)*60),height:3,borderRadius:2,background:"#8b5cf6",minWidth:2}}/>
                          <span style={{fontFamily:"monospace",fontSize:11,color:"#7d8590"}}>{s.z5}m{isZ5Rec?" 🏆":""}</span>
                        </div>
                      ) : <span style={{color:"#21262d"}}>—</span>}
                    </td>
                    <td style={{padding:"9px 12px",fontSize:10,color:ESF_COLORS[s.esf]||"#7d8590",fontWeight:600}}>{s.esf}</td>
                    <td style={{padding:"9px 12px",fontFamily:"monospace",fontSize:10,color:s.cr==="Pre"?"#6b7280":"#7d8590"}}>{s.cr}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* FOOTER */}
        <div style={{marginTop:24,paddingTop:16,borderTop:"1px solid #21262d",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <span style={{fontSize:9,color:"#7d8590",letterSpacing:2,textTransform:"uppercase"}}>Training Log · Nicolás · Buenos Aires</span>
          <span style={{fontSize:9,color:"#7d8590",letterSpacing:2,textTransform:"uppercase"}}>Última sesión: {lastSession.f}</span>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TrainingLog/>);
</script>
</body>
</html>
